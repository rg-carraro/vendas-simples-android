plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.controlevendas'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vendassimples.app'
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName '1.0.0'
    }

    // A assinatura é configurada somente a partir de arquivo local ignorado pelo Git.
    def signingPropertiesPath = System.getenv('VENDAS_KEYSTORE_PROPERTIES') ?: "${System.getProperty('user.home')}/keystore.properties"
    def signingPropertiesFile = new File(signingPropertiesPath)
    if (!signingPropertiesFile.isFile()) {
        throw new GradleException("Release signing configuration not found: ${signingPropertiesFile.absolutePath}")
    }
    def signingProperties = new Properties()
    def signingText = signingPropertiesFile.getText('UTF-8').replace('\uFEFF', '')
    signingProperties.load(new StringReader(signingText))
    def signingStoreFile = signingProperties.getProperty('storeFile')
    def signingStorePassword = signingProperties.getProperty('storePassword')
    def signingKeyAlias = signingProperties.getProperty('keyAlias')
    def signingKeyPassword = signingProperties.getProperty('keyPassword')
    if (![signingStoreFile, signingStorePassword, signingKeyAlias, signingKeyPassword].every { it }) {
        throw new GradleException("Incomplete release signing configuration in ${signingPropertiesFile.absolutePath}")
    }
    signingConfigs {
        release {
            storeFile new File(signingStoreFile)
            storePassword signingStorePassword
            keyAlias signingKeyAlias
            keyPassword signingKeyPassword
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.android.billingclient:billing:9.1.0'
    testImplementation 'junit:junit:4.13.2'
}

